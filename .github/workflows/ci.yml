name: CI

# 权威门禁清单在 scripts/gates/run.mjs —— CI 只负责"在干净 checkout 上把它们跑一遍"，
# 不自己复述规则（复述出来的第二份必然与本地漂移）。
#
# 这里跑的是**静态门**：不需要 gh 登录、不需要浏览器、不需要凭据，所以公开仓库的
# fork PR 也能完整跑。实例门（mounted / negative-control / git-source / standalone）
# 要真实 GitHub 与 Playwright，按改动面在本地跑：
#   node scripts/gates/run.mjs --instance <仓库路径>
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 包契约 / 发布卫生（本机路径与凭据）/ 决策记录 / 文档链接 / 主题令牌 /
      # 产物新鲜度（重建后 lib/ 必须无漂移）/ typecheck / 单测 / 门禁自证。
      - name: Gates
        run: node scripts/gates/run.mjs

      # 使用者从 git 源拿到的就是这份 tarball：内容缺一个就装不起来（lib/ 入库免构建）。
      - name: Packed tarball contents
        run: |
          pnpm pack --pack-destination /tmp
          TAR=$(ls /tmp/dsh-pr-inbox-*.tgz)
          tar -tzf "$TAR" | sort
          for entry in \
            package/lib/index.js \
            package/lib/client.js \
            package/cordis.patch.yml \
            package/icon.svg \
            package/locale/zh.json \
            package/locale/en.json \
            package/package.json
          do
            tar -tzf "$TAR" | grep -qx "$entry" || { echo "✗ tarball 缺 $entry"; exit 1; }
          done
          echo "✅ tarball 内容齐全"